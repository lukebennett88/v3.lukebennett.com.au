# image-size and extract-zip are at latest upstream with no patched version published;
# transitive via @astrojs/netlify dev chain; re-check when Netlify updates its deps.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-jmr9-qjv8-65gv
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  sharp: false
catalogMode: prefer
minimumReleaseAge: 2880 # Security: Wait 2 days (2880 minutes) before installing newly released packages
overrides:
  sharp: ^0.35.4
  toml: ^4.3.0
packages:
  - apps/*
  - packages/*
peerDependencyRules:
  allowedVersions:
    "@astrojs/check>typescript": "7"
trustLockfile: true
catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/compiler-rs": ^0.4.0
  "@astrojs/markdoc": ^2.0.9
  "@astrojs/netlify": ^8.2.5
  "@astrojs/react": ^6.0.5
  "@astrojs/rss": ^4.0.19
  "@astrojs/sitemap": ^3.7.4
  "@biomejs/biome": 2.3.0
  "@keystatic/astro": ^6.0.0
  "@keystatic/core": ^0.6.9
  "@manypkg/cli": ^0.25.1
  "@sindresorhus/slugify": ^3.0.1
  "@tailwindcss/typography": ^0.5.20
  "@tailwindcss/vite": ^4.3.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@unpic/react": ^1.0.2
  astro: ^7.3.1
  clsx: ^2.1.1
  prettier: ^3.9.6
  prettier-plugin-astro: ^0.14.1
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.2.8
  react-compiler-runtime: 19.0.0-beta-ebf51a3-20250411
  react-dom: ^19.2.8
  shiki: ^4.4.3
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tiny-invariant: ^1.3.3
  turbo: ^2.10.12
  typescript: ^7.0.2
  vite: ^8.2.2
  zod: ^4.5.4
